version: "3.8"
services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: korp_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
    ports:
      - "5433:5432"
    volumes:
      - pgdata1:/var/lib/postgresql/data 

  db2:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: korp_billing_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
    ports:
      - "5434:5432" 
    volumes:
      - pgdata2:/var/lib/postgresql/data 

volumes:
  pgdata1:
  pgdata2: